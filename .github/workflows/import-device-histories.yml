name: Import device histories
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select dry-run first; import performs branch writes'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - import
permissions:
  contents: write
concurrency:
  group: device-history-migration
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect source and destination
        if: ${{ inputs.mode == 'dry-run' }}
        run: bash scripts/import-device-history.sh --dry-run
      - name: Import complete source histories
        if: ${{ inputs.mode == 'import' }}
        run: bash scripts/import-device-history.sh --push
