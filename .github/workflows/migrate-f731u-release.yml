name: Migrate latest F731U release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit (read-only) or publish'
        type: choice
        required: true
        default: audit
        options:
          - audit
          - publish
permissions:
  contents: write
concurrency:
  group: f731u-release-migration
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source release and download original APK
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-audit
          curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/youyoudezhuzhu/rmg-f731u/releases/latest" > release-audit/source-release.json
          tag="$(jq -r '.tag_name' release-audit/source-release.json)"
          echo "Latest source release: $tag"
          if [[ "$tag" != "v0.2.36" ]]; then
            echo "::error::Source latest release differs from expected v0.2.36. Refusing migration."
            exit 1
          fi
          mapfile -t assets < <(jq -r '.assets[] | select(.name | ascii_downcase | endswith(".apk")) | [.id,.name,.size] | @tsv' release-audit/source-release.json)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No APK attached to the source release. Refusing to substitute an Actions artifact."
            exit 1
          fi
          for row in "${assets[@]}"; do
            IFS=$'\t' read -r id name size <<< "$row"
            if [[ "$name" == */* || "$name" == *..* ]]; then
              echo "::error::Unexpected asset name: $name"; exit 1
            fi
            echo "Downloading original release asset $name (expected $size bytes)"
            curl -fsSL --retry 3 -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/youyoudezhuzhu/rmg-f731u/releases/assets/$id" \
              -o "release-audit/$name"
            actual="$(stat -c %s "release-audit/$name")"
            if [[ "$actual" != "$size" ]]; then
              echo "::error::Asset size mismatch for $name: $actual != $size"
              exit 1
            fi
            file "release-audit/$name"
          done
          (cd release-audit && sha256sum -- *.apk) | tee release-audit/SHA256SUMS
          if [[ "$MODE" != "publish" ]]; then
            echo "Audit only: no tag or release created."
            exit 0
          fi
          destination_tag="f731u-v0.2.36"
          if gh release view "$destination_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Destination release already exists; refusing overwrite."
            exit 1
          fi
          source_commit="$(jq -r '.target_commitish' release-audit/source-release.json)"
          # Resolve the original tag directly rather than trusting target_commitish (which can be 'main').
          curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/youyoudezhuzhu/rmg-f731u/git/ref/tags/v0.2.36" > release-audit/source-tag.json
          source_commit="$(jq -r '.object.sha' release-audit/source-tag.json)"
          object_type="$(jq -r '.object.type' release-audit/source-tag.json)"
          if [[ "$object_type" == "tag" ]]; then
            curl -fsSL -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/youyoudezhuzhu/rmg-f731u/git/tags/$source_commit" > release-audit/annotated-tag.json
            source_commit="$(jq -r '.object.sha' release-audit/annotated-tag.json)"
          fi
          git fetch origin device/f731u
          git cat-file -e "$source_commit^{commit}"
          git merge-base --is-ancestor "$source_commit" origin/device/f731u
          git tag "$destination_tag" "$source_commit"
          git push origin "refs/tags/$destination_tag"
          mapfile -t apks < <(find release-audit -maxdepth 1 -name '*.apk' -type f -print)
          gh release create "$destination_tag" "${apks[@]}" release-audit/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "F731U v0.2.36" \
            --notes "Original F731U v0.2.36 APK assets migrated byte-for-byte from youyoudezhuzhu/rmg-f731u. Supported firmware: F731USQS8GZF1. See SHA256SUMS."
